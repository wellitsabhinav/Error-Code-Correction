name: GREENS extended validation

on:
  workflow_dispatch:
  pull_request:
    paths: ["**.py", "**.cpp", "**.hpp", "**.sv", "**.v", "requirements*.txt", "Makefile", "CMakeLists.txt", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["**.py", "**.cpp", "**.hpp", "**.sv", "**.v", "requirements*.txt", "Makefile", "CMakeLists.txt", ".github/workflows/ci.yml"]

permissions:
  contents: read

concurrency:
  group: greens-extended-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # Frozen campaign validators compare historical Git trees.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore frozen mixed-newline evidence
        run: python scripts/restore_frozen_checkout_bytes.py --restore --refresh-index

      - name: Validate public artifact contract
        run: python scripts/check_artifact.py

      - name: Diagnose environment
        run: python eccsim.py doctor --strict

      - name: Build native simulators
        run: make

      - name: Install pinned CMake
        if: matrix.python-version == '3.12'
        run: python -m pip install cmake==4.4.4

      - name: Configure, build and test the pinned CMake contract
        if: matrix.python-version == '3.12'
        run: |
          cmake -S . -B tmp/cmake-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build tmp/cmake-ci --parallel 2
          ctest --test-dir tmp/cmake-ci --timeout 60 --output-on-failure

      - name: Run make test contract
        run: make test

      - name: Run complete Python suite
        run: python -m pytest -q

  windows:
    name: Windows / Python 3.11 / UCRT64
    runs-on: windows-latest
    steps:
      - name: Enable long scientific artifact paths
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore frozen mixed-newline evidence
        run: python scripts/restore_frozen_checkout_bytes.py --restore --refresh-index

      - name: Validate public artifact contract
        run: python scripts/check_artifact.py

      - name: Set up matching GNU build and runtime tools
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc

      - name: Diagnose, build, and test
        shell: msys2 {0}
        run: |
          # Native Git supports the retained Windows long paths; MSYS Git does not.
          export PATH="/c/Program Files/Git/cmd:$PATH"
          git config core.longpaths true
          python eccsim.py doctor --strict
          # Select POSIX recipes because this step runs under MSYS2 bash.
          make OS=
          make OS= test
          python -m pytest -q

  rtl:
    # Experimental diagnostics retain the known legacy BCH counterexample.
    # The ordinary supported SECDED smoke contract runs in fast-ci.yml.
    if: github.event_name == 'workflow_dispatch'
    name: RTL evidence / Icarus + Verilator + Yosys-ABC
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install open-source RTL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys

      - name: Set up Python for the evidence runner
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Install evidence-runner dependency
        run: python -m pip install -r requirements.txt

      - name: Run and archive complete RTL validation
        run: python scripts/run_safeforge_hardware_validation.py

      - name: Upload actual RTL and synthesis logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: safeforge-hardware-validation-${{ github.sha }}
          path: reports/safeforge_hardware_validation/
          if-no-files-found: error
